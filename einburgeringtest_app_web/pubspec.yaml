// [2026-01-07] File: pubspec.yaml
name: einbuergerungstest_2026
description: "Modern German Citizenship Test App"
version: 1.0.1+10
publish_to: 'none'

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.6
  provider: ^6.1.1
  google_fonts: ^6.2.1
  shared_preferences: ^2.2.2
  intl: ^0.20.2
  google_mobile_ads: ^5.1.0
  confetti: ^0.8.0
  easy_localization: ^3.0.8
  in_app_purchase: ^3.2.0
  share_plus: ^12.0.1
  # New dependencies from FCC project
  purchases_flutter: ^8.0.0
  purchases_ui_flutter: ^8.11.0
  url_launcher: ^6.3.2
  http: ^1.6.0
  firebase_core: ^4.4.0
  firebase_auth: ^6.1.4
  cloud_firestore: ^6.1.2
  google_sign_in: ^7.2.0
  device_info_plus: ^12.3.0
  connectivity_plus: ^7.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true

  assets:
    - assets/data/
    - assets/data/lang/
    - assets/images/
    - assets/translations/

# [2026-01-07] File: pubspec.yaml

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/app_icon.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/images/app_icon.png"